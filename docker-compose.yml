services:
  db:
    image: postgres:16-alpine
    container_name: easybooking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: easybooking
      POSTGRES_PASSWORD: easybooking
      POSTGRES_DB: easybooking
    ports:
      # 5433 côté machine pour ne pas entrer en conflit avec un PostgreSQL local (5432)
      - "5433:5432"
    volumes:
      - easybooking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easybooking -d easybooking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  easybooking_pgdata:
