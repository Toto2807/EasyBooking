[pytest]
pythonpath = .
testpaths = tests
addopts = -ra
junit_family = xunit1
markers =
    unit: tests unitaires (sans base de données)
    integration: tests d'intégration (API + PostgreSQL)
    performance: tests de performance et de charge
    security: tests de sécurité
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using .httpx. with .starlette.testclient. is deprecated
